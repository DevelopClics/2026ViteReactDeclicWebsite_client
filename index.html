    <div id="root"></div>
    <script>
      // Add a passive event listener polyfill to address the "non-passive event listener" warnings.
      // This script should be placed before any other scripts that might attach event listeners.
      (function () {
        if (typeof EventTarget === "undefined") return;
        const addEventListener = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (
          type,
          listener,
          options
        ) {
          if (
            type.includes("touch") &&
            typeof options === "object" &&
            options.passive === undefined
          ) {
            options.passive = true;
          }
          return addEventListener.call(this, type, listener, options);
        };
      })();
    </script>
